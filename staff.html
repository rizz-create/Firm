  // --- FIXED: overdue now works for past months too ---
  function dueFlag(t){
    if(!t.due || t.type==="qtr") return "";

    if(sel>cur) return "";              // a future month — not due yet

  function summaryOf(tasks){

  function drillPred(k,t){ var c=cell(t.id);
    if(k==="overdue")return dueFlag(t)==="overdue";

    if(k==="pending")return c.status!=="Filed / Done"&&c.status!=="N/A";
    if(k==="done")return c.status==="Filed / Done";
    if(k==="blocked")return !!c.blocked;

  function nowIso(){ return new Date().toISOString(); }
  function fmtWhen(iso){ if(!iso)return ""; var d=new Date(iso); return ordDate(d)+" "+d.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"}); }
  function commit(t){ saveCell(t.id); renderAll(); renderSheetBody(); }
  function setWork(t,x){ if(x!=="Not started"&&x!=="Data received"&&!isOwner)return; cell(t.id).status=x; commit(t); }
  function submitForReview(t){ var c=cell(t.id); c.status="Prepared"; c.preparedBy=actor(); c.preparedAt=nowIso(); c.returnNote=""; c.returnedBy=""; c.returnedAt=""; c.reviewedBy=""; c.reviewedAt=""; c.reviewNote=""; commit(t); }
  function withdraw(t){ var c=cell(t.id); if(c.status!=="Prepared")return; c.status="Data received"; commit(t); }
  function approve(t,note){ if(!isOwner)return; var c=cell(t.id); c.status="Reviewed"; c.reviewedBy=actor(); c.reviewedAt=nowIso(); c.reviewNote=note||""; c.returnNote=""; commit(t); }
  function sendBack(t,note){ if(!isOwner)return; var c=cell(t.id); c.status="Data received"; c.returnNote=note; c.returnedBy=actor(); c.returnedAt=nowIso(); c.reviewedBy=""; c.reviewedAt=""; commit(t); }
  function markFiled(t,arn){ var c=cell(t.id); if(!isOwner&&c.status!=="Reviewed")return; c.status="Filed / Done"; c.filedBy=actor(); c.filedAt=nowIso(); c.arn=arn||c.arn||""; commit(t); }
  function undoApproval(t){ if(!isOwner)return; var c=cell(t.id); c.status="Prepared"; c.reviewedBy=""; c.reviewedAt=""; commit(t); }
  function ownerSet(t,x){ if(!isOwner)return; var c=cell(t.id);
    if(x==="Reviewed"&&c.status!=="Reviewed"){ c.reviewedBy=actor(); c.reviewedAt=nowIso(); }
    if(x==="Filed / Done"&&c.status!=="Filed / Done"){ c.filedBy=actor(); c.filedAt=nowIso(); }
    if(x==="Prepared"&&!c.preparedBy){ c.preparedBy=actor(); c.preparedAt=nowIso(); }
    c.status=x; commit(t); }

      var c2=el("td"); var nm=el("input"); nm.type="text"; nm.value=tk.name; nm.addEventListener("change",function(){ liveTask(tk).name=nm.value.trim(); save(whoami()); }); c2.appendChild(nm); tr.appendChild(c2);
      var c3=el("td"); var du=el("input"); du.type="number"; du.min="1"; du.max="31"; du.value=(tk.due==null?"":tk.due); du.placeholder="—"; du.addEventListener("change",function(){ var v=parseInt(du.value,10); liveTask(tk).due=isNaN(v)?null:v; save(whoami()); }); c3.appendChild(du); tr.appendChild(c3);
      var c4=el("td"); var ty=el("select"); TYPE_OPTS.forEach(function(o){ ty.appendChild(opt(o[0],o[1],o[0]===tk.type)); }); ty.addEventListener("change",function(){ liveTask(tk).type=ty.value; save(whoami()); }); c4.appendChild(ty); tr.appendChild(c4);
      var c5=el("td"); var as=el("select"); as.appendChild(opt("","— unassigned —",!tk.ownerId)); state.staff.forEach(function(st){ as.appendChild(opt(st.id,st.name,st.id===tk.ownerId)); }); as.addEventListener("change",function(){ liveTask(tk).ownerId=as.value; save(whoami()); }); c5.appendChild(as); tr.appendChild(c5);
      var c6=el("td"); var rm=el("button","iconbtn","Remove"); rm.addEventListener("click",function(){ if(!confirm("Remove task \""+tk.name+"\"? Its status history is deleted.")) return; Object.keys(state.board).forEach(function(pk){ delete state.board[pk][tk.id]; }); state.tasks=state.tasks.filter(function(x){return x.id!==tk.id;}); save(whoami()); renderManage(); }); c6.appendChild(rm); tr.appendChild(c6);
      tb.appendChild(tr);
    });
    t.appendChild(tb); body.appendChild(t);
    var add=el("div","addrow");
    var f1=el("div","fld"); f1.appendChild(el("label",null,"Client")); var ac=el("select"); state.clients.forEach(function(cl){ ac.appendChild(opt(cl.id,cl.name)); }); f1.appendChild(ac); add.appendChild(f1);
    var f2=el("div","fld"); f2.appendChild(el("label",null,"Task")); var at=el("input"); at.type="text"; at.placeholder="e.g. GSTR-1"; f2.appendChild(at); add.appendChild(f2);
    var f3=el("div","fld due"); f3.appendChild(el("label",null,"Due day")); var ad=el("input"); ad.type="number"; ad.min="1"; ad.max="31"; ad.placeholder="—"; f3.appendChild(ad); add.appendChild(f3);
    var f4=el("div","fld"); f4.appendChild(el("label",null,"Type")); var aty=el("select"); TYPE_OPTS.forEach(function(o){ aty.appendChild(opt(o[0],o[1])); }); f4.appendChild(aty); add.appendChild(f4);
    var f5=el("div","fld"); f5.appendChild(el("label",null,"Assign to")); var aa=el("select"); aa.appendChild(opt("","— unassigned —")); state.staff.forEach(function(st){ aa.appendChild(opt(st.id,st.name)); }); f5.appendChild(aa); add.appendChild(f5);
    var b=el("button","primary","Add task"); b.addEventListener("click",function(){ var nm=at.value.trim(); if(!nm){at.focus();return;} var v=parseInt(ad.value,10); state.tasks.push({id:uid("tk"),clientId:ac.value,name:nm,due:isNaN(v)?null:v,type:aty.value,ownerId:aa.value}); save(whoami()); renderManage(); }); add.appendChild(b);
    body.appendChild(add);
  }

  function refreshOwnerFilter(){ var sel=$("#fOwner"),cur=sel?sel.value:""; if(!sel)return; sel.innerHTML='<option value="">All staff</option>'; state.staff.slice().sort(function(a,b){return a.name<b.name?-1:1;}).forEach(function(st){ sel.appendChild(opt(st.id,st.name,st.id===cur)); }); }
  function refreshClientFilter(){ var sel=$("#fClient"); if(!sel)return; var cur=sel.value; sel.innerHTML='<option value="">All clients</option>'; visibleClients().slice().sort(function(a,b){return a.name<b.name?-1:1;}).forEach(function(c){ sel.appendChild(opt(c.id,c.name,c.id===cur)); }); }
  function refreshTaskFilter(){ var sel=$("#fTask"); if(!sel)return; var cur=sel.value,seen={},names=[]; baseTasks().forEach(function(t){ if(!seen[t.name]){seen[t.name]=1;names.push(t.name);} }); names.sort(); sel.innerHTML='<option value="">All tasks</option>'; names.forEach(function(n){ sel.appendChild(opt(n,n,n===cur)); }); }
  function refreshFilters(){ refreshOwnerFilter(); refreshClientFilter(); refreshTaskFilter(); }
  function renderSaved(){ var n=$("#saved"); if(!n)return; if(fbMode){ n.textContent="● Live"; return; } var m=state.meta||{}; if(serverMode)n.textContent="● Shared"; else n.textContent=m.updatedAt?"Saved on this device":"Offline"; }

  function ordDate(d){ return d.getDate()+" "+["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][d.getMonth()]; }
  function buildDigest(){
    var s=summaryOf(baseTasks()), now=new Date(), lines=[];
    lines.push("*Marv & Co — Compliance status*"+(isOwner?"":" — "+(staffName(viewer.staffId)||"Staff")));
    lines.push(periodName(state.period)+" · as of "+ordDate(now));
    lines.push(s.fl+" of "+s.applicable+" filings done");
    var blocked=[],due=[],notstarted=[],toreview=[],ready=[];
    baseTasks().forEach(function(t){
      var c=cell(t.id),flag=dueFlag(t),cl=(clientById(t.clientId)||{name:"?"}).name,own=t.ownerId?staffName(t.ownerId):"unassigned";
      if(c.blocked)blocked.push("• "+cl+" — "+t.name+" · "+own+(c.waiting?(" — waiting on "+c.waiting):""));
      if(flag)due.push("• "+cl+" — "+t.name+" · due "+dueLabel(t)+(flag==="overdue"?" (OVERDUE)":"")+" · "+own);
      if(c.status==="Prepared")toreview.push("• "+cl+" — "+t.name+" · prepared by "+(c.preparedBy||own));
      if(c.status==="Reviewed")ready.push("• "+cl+" — "+t.name+" · "+own+(c.reviewedBy?(" · ✓ "+c.reviewedBy):""));
      if(c.status==="Not started")notstarted.push("• "+cl+" — "+t.name+" · "+own);
    });
    function section(title,arr,cap){
      if(!arr.length)return; lines.push(""); lines.push("*"+title+" ("+arr.length+")*");
      var shown=(cap&&arr.length>cap)?arr.slice(0,cap):arr; lines.push(shown.join("\n"));
      if(cap&&arr.length>cap)lines.push("…and "+(arr.length-cap)+" more on the board");
    }
    section("Awaiting partner review",toreview,null); section("Reviewed — ready to file",ready,null);
    section("Blocked",blocked,null); section("Due soon / overdue",due,null); section("Not started",notstarted,20);
    if(!blocked.length&&!due.length){ lines.push(""); lines.push("No blocked or overdue items right now."); }
    return lines.join("\n");
  }
  function shareWhatsApp(){ var text=buildDigest(); try{ if(navigator.clipboard)navigator.clipboard.writeText(text); }catch(e){} window.open("https://wa.me/?text="+encodeURIComponent(text),"_blank"); }

  function exportData(){ saveBlob(JSON.stringify(state,null,2),"application/json","marv-co-board-"+state.period+".json"); }
  function saveBlob(text,mime,filename){ var blob=new Blob([text],{type:mime}),url=URL.createObjectURL(blob),a=document.createElement("a"); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); },100); }

  function init(){
    load(); var pr=$("#period"); if(pr)pr.value=state.period;
    try{ var u=localStorage.getItem(LS_USER); if(u)$("#whoami").value=u; }catch(e){}
    loadSession();
    $("#period").addEventListener("change",function(){ state.period=$("#period").value||currentPeriod(); renderAll(); });
    $("#q").addEventListener("input",function(){ renderPanel(); });
    $("#fOwner").addEventListener("change",function(){ renderPanel(); });
    $("#fClient").addEventListener("change",function(){ renderPanel(); });
    $("#fTask").addEventListener("change",function(){ renderPanel(); });
    $("#clearFilters").addEventListener("click",clearAllFilters);
    $("#searchBtn").addEventListener("click",function(){ var w=$("#searchwrap"); w.classList.toggle("open"); if(w.classList.contains("open"))$("#q").focus(); else { $("#q").value=""; renderPanel(); } });
    $("#menuBtn").addEventListener("click",function(e){ e.stopPropagation(); $("#menu").classList.toggle("open"); });
    document.addEventListener("click",function(e){ var m=$("#menu"); if(m.classList.contains("open") && !m.contains(e.target) && e.target!==$("#menuBtn")) m.classList.remove("open"); });
    $("#backBtn").addEventListener("click",function(){ setTab("overview"); });
    $("#btnManage").addEventListener("click",function(){ $("#menu").classList.remove("open"); openManage("staff"); });
    $("#btnWhatsapp").addEventListener("click",function(){ $("#menu").classList.remove("open"); shareWhatsApp(); });
    $("#btnExport").addEventListener("click",function(){ $("#menu").classList.remove("open"); exportData(); });
    $("#btnSignout").addEventListener("click",function(){ $("#menu").classList.remove("open"); signOut(); });
    $("#mClose").addEventListener("click",closeManage);
    $("#overlay").addEventListener("click",function(e){ if(e.target===$("#overlay"))closeManage(); });
    Array.prototype.forEach.call(document.querySelectorAll(".modal-tab"),function(b){ b.addEventListener("click",function(){ manageSection=b.getAttribute("data-sec"); renderManage(); }); });
    Array.prototype.forEach.call(document.querySelectorAll("#loginOverlay .role-btn"),function(b){ b.addEventListener("click",function(){ loginRole=b.getAttribute("data-role"); renderLogin(); }); });
    $("#sheet").addEventListener("click",function(e){ if(e.target===$("#sheet"))closeSheet(); });
    document.addEventListener("keydown",function(e){ if(e.key==="Escape"){ closeSheet(); closeManage(); $("#menu").classList.remove("open"); } });
    applyRole(); refreshFilters(); renderAll(); renderSaved(); if(!session)showLogin(); if(fbConfigured)initFirebase(); else initServer();
  }
  if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",init); else init();
})();
</script>
</body>
