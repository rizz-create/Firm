  // ===== Recurring tasks =====
  // A task in the Task master is a TEMPLATE. Each return period it covers becomes an INSTANCE
  // with its own status. An instance becomes pending on the day its period closes:
  //   monthly   - 1st of the next month       (Sep GSTR-1 pending 1 Oct, due 11 Oct)
  //   quarterly - 1st after the quarter ends   (Jul-Sep TDS return pending 1 Oct, due 31 Oct)
  //   annual    - 1 April, start of next FY    (FY 2025-26 GSTR-9 pending 1 Apr 2026, due 31 Dec 2026)
  //   one-time  - the moment it is created
  // Period keys: monthly "2026-09" · quarterly "2026-09" (quarter-end month) · annual "FY2025-26" · one-time "ONCE"
  function freqOf(t){ if(t.freq)return t.freq; return t.type==="qtr"?"quarterly":"monthly"; }
  function rankOf(y,m){ return y*12+(m-1); }
  function pkOfRank(r){ return rankToPeriod(r); }
  function fyKey(y){ return "FY"+y+"-"+String((y+1)%100).padStart(2,"0"); }
  function fyStart(pk){ return +String(pk).slice(2,6); }
  function fyOfMonth(pk){ var p=pk.split("-"),y=+p[0],m=+p[1]; return m>=4?y:y-1; }
  function startPeriod(){ var s=(state.settings||{}).startPeriod; return /^\d{4}-\d{2}$/.test(s||"")?s:DEFAULT_START; }
  function defaultFrom(f){ var sp=startPeriod(); return f==="annual"?fyKey(fyOfMonth(sp)-1):sp; }
  function fromOf(t){ var f=freqOf(t), v=t.from||"";
    if(f==="annual") return /^FY\d{4}-\d{2}$/.test(v)?v:defaultFrom(f);
    return /^\d{4}-\d{2}$/.test(v)?v:defaultFrom(f); }
  function latestFrom(f){ var cur=periodRank(currentPeriod());
    if(f==="annual"){ var y=fyOfMonth(currentPeriod()); return fyKey(y-1); }
    if(f==="quarterly"){ for(var r=cur-1;r>cur-4;r--){ if(((r%12)+1)%3===0)return pkOfRank(r); } }
    return pkOfRank(cur-1); }
  function clampDay(y,m,d){ var last=new Date(y,m,0).getDate(); return new Date(y,m-1,Math.min(d,last)); }
  function isTds(t){ return /tds/i.test(t.name||""); }
  function instDue(t,f,pk){
    if(f==="once"){ var s=String(t.dueDate||""); if(!/^\d{4}-\d{2}-\d{2}$/.test(s))return null; var q=s.split("-"); return new Date(+q[0],+q[1]-1,+q[2]); }
    if(f==="annual"){ if(!t.due||!t.dueMonth)return null; var y0=fyStart(pk), dm0=+t.dueMonth; return clampDay(dm0>=4?y0+1:y0+2,dm0,+t.due); }
    var p=pk.split("-"), y=+p[0], m=+p[1], dy=y, dm=m+1; if(dm>12){ dm=1; dy++; }
    var day=+t.due||0;
    if(f==="quarterly"){ if(!day&&isTds(t))day=31; if(m===3&&isTds(t)){ dm=5; day=31; } }   // Q4 TDS return: 31 May
    else if(m===3&&isTds(t)&&t.type!=="int") day=30;                                      // March TDS deposit: 30 April
    if(!day)return null;
    return clampDay(dy,dm,day);
  }
  function periodLong(x){ var f=x.freq, pk=x.pk;
    if(f==="once")return "One-time"; if(f==="annual")return "FY "+pk.slice(2);
    if(f==="quarterly"){ var p=pk.split("-"),m=+p[1]; return MON[m-3]+"–"+MON[m-1]+" "+p[0]; }
    return periodName(pk); }
  function periodShort(x){ var f=x.freq, pk=x.pk;
    if(f==="once")return "One-time"; if(f==="annual")return "FY "+pk.slice(4);
    var p=pk.split("-"),m=+p[1],yy="’"+p[0].slice(2);
    if(f==="quarterly")return MON[m-3]+"–"+MON[m-1]+" "+yy;
    return MON[m-1]+" "+yy; }
  function makeInst(t,pk){ var f=freqOf(t), x=Object.create(t);
    x.id=pk+"|"+t.id; x.tid=t.id; x.pk=pk; x.freq=f; x.dueAt=instDue(t,f,pk); return x; }
  function periodsOf(t){ var f=freqOf(t), cur=periodRank(currentPeriod()), out=[], r, lo;
    if(f==="once")return ["ONCE"];
    if(f==="annual"){ var y1=fyOfMonth(currentPeriod())-1, y0=Math.max(fyStart(fromOf(t)),y1-3); for(var y=y0;y<=y1;y++)out.push(fyKey(y)); return out; }
    lo=Math.max(periodRank(fromOf(t)),cur-36);
    for(r=lo;r<=cur-1;r++){ if(f==="quarterly"&&((r%12)+1)%3!==0)continue; out.push(pkOfRank(r)); }
    return out; }

      else { var nm=String(cl.zohoName||cl.name).toLowerCase().replace(/\s+/g," ").trim();

  function buildDigest(){
    var s=summaryOf(baseTasks()), now=new Date(), lines=[];
    lines.push("*Marv & Co — Compliance status*"+(isOwner?"":" — "+(staffName(viewer.staffId)||"Staff")));
    lines.push(scopeName()+" · as of "+ordDate(now));
    lines.push(showKey?(s.fl+" of "+s.applicable+" filings done"):((s.applicable-s.fl)+" pending · "+s.fl+" filed this month"));
    var blocked=[],due=[],notstarted=[],toreview=[],ready=[];
    baseTasks().forEach(function(t){
      var c=cell(t.id),flag=dueFlag(t),cl=(clientById(t.clientId)||{name:"?"}).name,tn=t.name+" ("+periodShort(t)+")",own=t.ownerId?staffName(t.ownerId):"unassigned";
      if(c.blocked)blocked.push("• "+cl+" — "+tn+" · "+own+(c.waiting?(" — waiting on "+c.waiting):""));
      if(flag)due.push("• "+cl+" — "+tn+" · due "+dueLabel(t)+(flag==="overdue"?" (OVERDUE)":"")+" · "+own);
      if(c.status==="Prepared")toreview.push("• "+cl+" — "+tn+" · prepared by "+(c.preparedBy||own));
      if(c.status==="Reviewed")ready.push("• "+cl+" — "+tn+" · "+own+(c.reviewedBy?(" · ✓ "+c.reviewedBy):""));
      if(c.status==="Not started")notstarted.push("• "+cl+" — "+tn+" · "+own);
    });
    function section(title,arr,cap){
      if(!arr.length)return; lines.push(""); lines.push("*"+title+" ("+arr.length+")*");
      var shown=(cap&&arr.length>cap)?arr.slice(0,cap):arr; lines.push(shown.join("\n"));
      if(cap&&arr.length>cap)lines.push("…and "+(arr.length-cap)+" more on the board");
    }
    section("Awaiting partner review",toreview,null); section("Reviewed — ready to file",ready,null);
    section("Blocked",blocked,null); section("Due soon / overdue",due,null); section("Not started",notstarted,20);
    if(!blocked.length&&!due.length){ lines.push(""); lines.push("No blocked or overdue items right now."); }
    return lines.join("\n");
  }

    $("#searchBtn").addEventListener("click",function(){ var w=$("#searchwrap"); w.classList.toggle("open"); if(w.classList.contains("open"))$("#q").focus(); else { $("#q").value=""; renderPanel(); } });
    $("#menuBtn").addEventListener("click",function(e){ e.stopPropagation(); $("#menu").classList.toggle("open"); });
    document.addEventListener("click",function(e){ var m=$("#menu"); if(m.classList.contains("open") && !m.contains(e.target) && e.target!==$("#menuBtn")) m.classList.remove("open"); });
    $("#backBtn").addEventListener("click",function(){ setTab("overview"); });
    $("#btnManage").addEventListener("click",function(){ $("#menu").classList.remove("open"); openManage("staff"); });
    $("#btnWhatsapp").addEventListener("click",function(){ $("#menu").classList.remove("open"); shareWhatsApp(); });
    $("#btnExport").addEventListener("click",function(){ $("#menu").classList.remove("open"); exportData(); });
    $("#btnSignout").addEventListener("click",function(){ $("#menu").classList.remove("open"); signOut(); });
    $("#mClose").addEventListener("click",closeManage);
    $("#overlay").addEventListener("click",function(e){ if(e.target===$("#overlay"))closeManage(); });
    Array.prototype.forEach.call(document.querySelectorAll(".modal-tab"),function(b){ b.addEventListener("click",function(){ manageSection=b.getAttribute("data-sec"); renderManage(); }); });
    Array.prototype.forEach.call(document.querySelectorAll("#loginOverlay .role-btn"),function(b){ b.addEventListener("click",function(){ loginRole=b.getAttribute("data-role"); renderLogin(); }); });
    $("#sheet").addEventListener("click",function(e){ if(e.target===$("#sheet"))closeSheet(); });
    document.addEventListener("keydown",function(e){ if(e.key==="Escape"){ closeSheet(); closeManage(); $("#menu").classList.remove("open"); } });
    applyRole(); refreshFilters(); renderAll(); renderSaved(); if(!session)showLogin(); if(fbConfigured)initFirebase(); else initServer();
  }
  if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",init); else init();
})();
</script>
</body>
</html>
